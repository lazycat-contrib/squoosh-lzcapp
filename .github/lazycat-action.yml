version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/squoosh.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: squoosh

build:
  run_buildscript: false

images:
  - id: squoosh
    target: service
    service: squoosh
    source: docker.io/dko0/squoosh
    channel: stable
    sort: semver
    tag_regex: '^1\.12\.0$'
    version_regex: '^(?P<version>\d+\.\d+\.\d+)$'
    delivery:
      mode: lazycat

stores:
  official:
    enabled: true
    skip_if_version_exists: true
    create_if_missing: false
    changelog_locales: [zh, en]
  private:
    enabled: true
    skip_if_version_exists: true
    name: Squoosh
    summary: Squoosh 的 LazyCat 自动构建版本
