application:
  subdomain: squoosh
  background_task: true
  multi_instance: false
  gpu_accel: false
  kvm_accel: false
  usb_accel: false
  upstreams:
    - location: /
      backend: http://squoosh:8080/
  public_path:
    - /
  file_handler:
    mime:
      - image/jpeg
      - image/jpg
      - image/png
      - image/webp
      - image/avif
      - image/svg+xml
      - image/gif
      - image/bmp
      - image/tiff
    actions:
      open: /?file=%u

services:
  squoosh:
    # upstream: docker.io/dko0/squoosh:1.12.0
    image: registry.lazycat.cloud/czyt/dko0/squoosh:df630b9bf89b8d8e
